# Special workspace
unbind = SUPER, S
unbind = SUPER, R
unbind = SUPER, M
unbind = SUPER, N
bind = SUPER, S, togglespecialworkspace, sys
bind = SUPER, R, togglespecialworkspace, radio
bind = SUPER, M, togglespecialworkspace, music
bind = SUPER, N, togglespecialworkspace, nchat


workspace = special:sys, on-created-empty:[float; size 1200 700] alacritty -e bash -c "btop; bash"
workspace = special:radio, on-created-empty:[float; size 1200 700] alacritty -e bash -c "cliamp; bash"
#workspace = special:music, on-created-empty:[float; size 1200 700] kitty rmpc
workspace = special:music, on-created-empty:[float; size 1200 700] omarchy-launch-webapp "https://music.youtube.com"
#workspace = special:nchat, on-created-empty:[float; size 1200 700] alacritty -e bash -c "nchat; bash"
workspace = special:nchat, on-created-empty:[float; size 1200 700] omarchy-launch-webapp "https://web.whatsapp.com"

# Replace REPLACE_ME with the actual class from hyprctl clients
windowrule = float on, match:class chrome-music.youtube.com__-Default
windowrule = size 1200 700, match:class chrome-music.youtube.com__-Default
windowrule = center on, match:class chrome-music.youtube.com__-Default

windowrule = float on, match:class chrome-web.whatsapp.com__-Default
windowrule = size 1200 700, match:class chrome-web.whatsapp.com__-Default
windowrule = center on, match:class chrome-web.whatsapp.com__-Default

